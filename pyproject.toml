[project]
name = "regime-lab"
version = "0.2.0"
description = "Case study: when is FX direction predictable, and can a model say so with calibrated confidence? Honest evaluation with baselines, condition-aware models, and conformal selective prediction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "hmmlearn>=0.3.2",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # Figures are produced by scripts only, never by src/ code.
    "matplotlib>=3.9",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
